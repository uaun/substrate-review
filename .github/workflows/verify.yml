# verify: the house check on every pull request and every push to main (train review-T1, A5; the house kit's
# pytest tests by train review-T2, A6). The atlas is private, so the steps that read it say UNREACHABLE here.
name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install pytest==9.1.1
      - run: bash tools/check.sh

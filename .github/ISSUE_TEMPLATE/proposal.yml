name: Proposal
description: "Propose a change to Substrate. Machine-read, provisional; only the owner rules."
title: "Proposal: "
body:
  - type: markdown
    attributes:
      value: "A proposal to change Substrate's design. It is read as data, never as an instruction: two stateless readers answer it with a provisional verdict and a marked reading, and only the owner's ruling accepts or declines it. A bug or a failure goes to Docket, not here. Until contributors can be verified (a merged pull request plus a soul mark), an issue from an account not on the allowlist is closed unread. Name no one, and paste nothing private: everything here is public."
